services:
  app:
    build:
      context: .
    ports:
      - "5050:5050"
    environment:
      FLASK_ENV: production
      SECRET_KEY: docker-development-secret
      DATABASE_URL: mysql+mysqlconnector://height:height_password@mysql:3306/the_height
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: the_height
      MYSQL_USER: height
      MYSQL_PASSWORD: height_password
      MYSQL_ROOT_PASSWORD: root_height_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uheight -pheight_password -Dthe_height -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine

volumes:
  mysql_data:
