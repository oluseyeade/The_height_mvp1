version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: height_apartment_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-height-apartment-change-me-in-production
      - DATABASE_URL=mysql+mysqlconnector://height_user:height_pass@db:3306/the_height?use_pure=True
      - USE_PROXY_FIX=True
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  db:
    image: mysql:8.0
    container_name: height_apartment_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: the_height
      MYSQL_USER: height_user
      MYSQL_PASSWORD: height_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
