<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Application</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container">
        <!-- header section begins -->
        <div class="row header">
            <div class="col text-center">
                <h1 class='mb-3'> Product Inventory </h1>
                <button type="button" class="btn btn-primary">
                    Count <span class="badge  mine">4</span>
                </button>
            </div>
        </div>
        <!-- header section ends -->
        <!-- form section begins-->
        <div class="row text-center formy">
            <div class="col-md-6 offset-md-3">
                <h3>Add Product</h3>
            </div>
            <div class="col-md-8 offset-md-2">
                <form action="" method="post" class="py-3 px-5 brr">
                    <div class="row my-4">
                        <div class="col-md-7">
                            <input type="text" class="form-control" placeholder="product name"/>
                        </div>
                        <div class="col-md-3">
                            <input type="number" class="form-control" placeholder=" Qty"/>
                        </div>

                        <div class="col-md-2 text-end">
                           <input type="submit" value="Add Product" class="btn btn-primary mine" />
                        </div>

                    </div>

                

                </form>
            </div>
        </div>
        <!-- form section ends -->
        <!-- content  section begins -->
        <div class="row products text-center">
            <div class="col-md-6 offset-md-3">
                <h3>Products Inventory </h3>
            </div>
            <div class="col-md-8 offset-md-2">
                <table class="table">
                  <thead>
                      <tr>
                        <th>S/N</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Action</th>
                      </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>Greek Yougurt Parfait</td>
                      <td>5</td>
                      <td><button class="btn btn-danger btn-sm">Delete</button></td>
                    </tr>
                    <tr>
                      <td>2</td>
                      <td>1l Apple Cider Vinegar</td>
                      <td>3</td>
                      <td><button class="btn btn-danger btn-sm">Delete</button></td>
                    </tr>
                    <tr>
                      <td>3</td>
                      <td> 1kg blueberry </td>
                      <td>8</td>
                      <td><button class="btn btn-danger btn-sm">Delete</button></td>
                    </tr>
    
                  </tbody>
                </table>
            </div>
        </div>
        <!-- content  section ends -->
          <!-- footer  section begins -->
        <div class="row footer pt-5 pb-2">
            <div class="col text-center">
              <h5>Copyright &copy; 2025</h5>
            </div>
        </div>
        <!-- footer  section ends -->
    </div>
</body>
</html>
