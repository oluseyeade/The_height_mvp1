{% extends 'base.html' %}

{% block content %}
<section class="py-5" style="background-color: var(--bg-dark-core);">
  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="glass-panel p-5 text-center">
          <div class="mb-4">
            <i class="fa-solid fa-shield-halved text-warning display-3"></i>
          </div>
          <h3 class="text-white fw-bold mb-3">Redirecting to Paystack Secure Payment Gateway…</h3>
          <p class="text-muted mb-4">Your booking is being prepared. Please complete the secure payment on Paystack to confirm your reservation.</p>
          <p class="text-warning fw-semibold mb-4">Booking Reference: {{ booking.booking_ref }}</p>
          <a href="{{ authorization_url }}" class="btn btn-gold px-4 py-3 fw-bold">
            <i class="fa-solid fa-lock me-2"></i> Continue to Paystack
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  window.location.replace('{{ authorization_url }}');
</script>
{% endblock %}
